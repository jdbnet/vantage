name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  APTUARY_DISTRIBUTION: stable
  APTUARY_COMPONENT: main

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: semantic
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev gcc pkg-config
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Install NSIS and MinGW
        if: matrix.target == 'windows'
        run: choco install nsis mingw -y

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build Windows
        if: matrix.target == 'windows'
        working-directory: cmd/vantage
        run: wails build -nsis -ldflags "-s -w -X github.com/jdbnet/vantage/internal/appcore.Version=${{ env.VERSION }}"

      - name: Build macOS
        if: matrix.target == 'macos'
        working-directory: cmd/vantage
        run: wails build -ldflags "-s -w -X github.com/jdbnet/vantage/internal/appcore.Version=${{ env.VERSION }}"

      - name: Build Linux
        if: matrix.target == 'linux'
        working-directory: cmd/vantage
        run: wails build -ldflags "-s -w -X github.com/jdbnet/vantage/internal/appcore.Version=${{ env.VERSION }}"

      - name: Stage Windows installer
        if: matrix.target == 'windows'
        shell: bash
        run: |
          mkdir -p desktop-artifacts
          installer=$(find cmd/vantage/build/bin -name '*installer.exe' | head -n 1)
          cp "$installer" "desktop-artifacts/vantage_${VERSION}_windows_amd64-setup.exe"

      - name: Stage macOS zip
        if: matrix.target == 'macos'
        run: |
          mkdir -p desktop-artifacts
          ditto -c -k --keepParent cmd/vantage/build/bin/vantage.app "desktop-artifacts/vantage_${VERSION}_darwin_arm64.zip"

      - name: Stage Linux binary and deb
        if: matrix.target == 'linux'
        run: |
          mkdir -p desktop-artifacts
          cp cmd/vantage/build/bin/vantage "desktop-artifacts/vantage_${VERSION}_linux_amd64"
          chmod +x "desktop-artifacts/vantage_${VERSION}_linux_amd64"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          export ARCH=amd64
          "$(go env GOPATH)/bin/nfpm" package --packager deb --config nfpm.yaml --target desktop-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: desktop-artifacts/*
          if-no-files-found: error

  publish:
    needs: [version, desktop]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-artifacts

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Aptuary
        env:
          APTUARY_URL: ${{ secrets.APTUARY_URL }}
          APTUARY_API_KEY: ${{ secrets.APTUARY_API_KEY }}
        run: |
          if [ -z "$APTUARY_URL" ] || [ -z "$APTUARY_API_KEY" ]; then
            echo "Skipping Aptuary upload (APTUARY_URL and APTUARY_API_KEY secrets not set)"
            exit 0
          fi
          BASE="${APTUARY_URL%/}"
          QUERY="distribution=${APTUARY_DISTRIBUTION}&component=${APTUARY_COMPONENT}"
          for deb in desktop-artifacts/vantage_${VERSION}_*.deb dist/vantage_${VERSION}_*.deb; do
            [ -f "$deb" ] || continue
            echo "Uploading ${deb}"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${APTUARY_API_KEY}" \
              -F "file=@${deb}" \
              "${BASE}/api/v1/upload?${QUERY}"
          done
